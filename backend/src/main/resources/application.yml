spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shopflowdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
  sql:
    init:
      mode: always
      platform: mysql

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

application:
  security:
    jwt:
      secret-key: c2hvcGZsb3ctbWluaW1hbC1tdnAtc2hvcGZsb3ctbWluaW1hbC1tdnAtMjAyNg==
      expiration: 86400000
