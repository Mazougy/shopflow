spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:shopflowdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: validate
    show-sql: false
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

application:
  security:
    jwt:
      secret-key: c2hvcGZsb3ctbWluaW1hbC1tdnAtc2hvcGZsb3ctbWluaW1hbC1tdnAtMjAyNg==
      expiration: 86400000
